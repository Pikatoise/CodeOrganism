<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CodeOrganism design reference</title>
<style>
:root{color-scheme:dark;background:#100d17;color:#f4ecfc;font:14px system-ui}
*{box-sizing:border-box}body{margin:0}h1,h2,h3,p{margin:0}h1{font-size:22px;letter-spacing:-.04em}h2{font-size:17px}h3{font-size:15px}
header,.tools{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
header{padding:17px max(22px,4vw);border-bottom:1px solid #302640}
p,small{color:#c1aed1}small{font-size:12px}
main{display:grid;grid-template-columns:minmax(0,1fr) 305px;gap:18px;margin:0 auto;padding:24px;max-width:1560px}
section,aside{border:1px solid #37294a;border-radius:16px;background:#17111f;min-width:0}
.map-head,aside{padding:20px}.map-head{border-bottom:1px solid #2d223d}
canvas{width:100%;height:580px;display:block;background:radial-gradient(ellipse,#251633,#100b1a 78%)}
.legend{padding:12px 18px;border-top:1px solid #2d223d;display:flex;gap:15px;flex-wrap:wrap}
button{font:inherit;color:inherit;border:1px solid #4b3b61;background:#251a32;padding:7px 10px;border-radius:7px}
button[aria-pressed=true]{background:#57377a;border-color:#b083ee}
dl{display:grid;grid-template-columns:1fr auto;gap:10px;margin:16px 0}dd{margin:0;text-align:right}dt{color:#c1aed1}
ol{padding:0;list-style:none;margin:14px 0 24px}li{display:flex;justify-content:space-between;border-top:1px solid #392b4a;padding:10px 0}
aside{align-self:start}.reason{margin-top:10px}.selected{border-top:1px solid #392b4a;padding-top:14px}
@media(max-width:760px){main{grid-template-columns:1fr;padding:14px;gap:12px}canvas{height:390px}.map-head{padding:14px}.inspected{display:none}aside{padding:14px}}
</style>
<header><h1>CodeOrganism</h1><div class="tools"><p>Order API · Live</p><button>Detach</button></div></header>
<main>
<section><div class="map-head tools"><div><h2>Runtime map</h2><small>Design fixture · synthetic measurements</small></div><div><button id="cpu">CPU</button> <button id="all">All metrics</button> <button id="pause">Pause</button></div></div>
<canvas aria-label="Runtime topology illustration"></canvas><p class="legend" id="legend"></p></section>
<aside><h2 id="rank-title">Top modules</h2><small>Ranked by CPU · estimated ms/s</small><ol id="rank"></ol>
<div class="selected"><h3 id="selection"></h3><div class="inspected"><dl id="measurements"></dl><small class="reason">Estimated CPU · 1,000 ms interval · full sample window</small></div></div></aside>
</main>
<script>
const state = new URLSearchParams(location.search).get("state") || "overview";
const expanded = state !== "overview", combined = state === "combined";
const source = [
 [".26",".42","Web API",.58,4],[".59",".45","Orders",.91,10],[".81",".26","Payments",.60,6],
 [".76",".72","Storage",.33,4],[".30",".71","Libraries",.18,2],
];
const methods = [[.49,.23,"BuildOrder",.41,4],[.69,.30,"Validate",.33,4],[.60,.64,"PriceOrder",1,13],[.87,.52,"SaveOrder",.28,4],[.44,.58,"MapResult",.24,3]];
const points = expanded ? [...source,...methods] : source;
const edges = expanded ? [[0,5],[5,6],[6,7],[7,8],[8,3],[7,9],[9,4],[6,2],[5,1],[9,0]] : [[0,1],[1,2],[1,3],[1,4],[3,4]];
document.querySelector(combined ? "#all" : "#cpu").setAttribute("aria-pressed","true");
if(state==="spike")document.querySelector("#pause").textContent="Resume";
document.querySelector("#legend").textContent=combined?"Pulse: CPU   ·   Size: allocation rate   ·   Glow: call rate   ·   Line: observed stack":"Pulse: CPU   ·   Line: observed stack";
document.querySelector("#rank-title").textContent=expanded?"Top methods":"Top modules";
const ranked=expanded?[["PriceOrder","836 ms/s"],["BuildOrder","122 ms/s"],["Validate","90 ms/s"]]:[["Orders","910 ms/s"],["Payments","284 ms/s"],["Web API","157 ms/s"]];
document.querySelector("#rank").replaceChildren(...ranked.map(([k,v])=>{const li=document.createElement("li");li.textContent=k;const right=document.createElement("span");right.textContent=v;li.append(right);return li}));
document.querySelector("#selection").textContent=expanded?"Orders / PriceOrder":"Orders";
const rows=combined?[["CPU","836 ms/s"],["Allocations","1.4 MB/s"],["Calls","184 calls/s"]]:[["CPU",expanded?"836 ms/s":"910 ms/s"],["Allocations","Unavailable"],["Calls","Unavailable"]];
for(const [name,value] of rows){const key=document.createElement("dt"),data=document.createElement("dd");key.textContent=name;data.textContent=value;document.querySelector("#measurements").append(key,data)}
const canvas=document.querySelector("canvas"),ctx=canvas.getContext("2d");
function draw(){
 const w=canvas.clientWidth,h=canvas.clientHeight;canvas.width=w;canvas.height=h;
 for(let j=0;j<edges.length;j++){
  const [a,b]=edges[j].map(i=>points[i]),ax=+a[0]*w,ay=+a[1]*h,bx=+b[0]*w,by=+b[1]*h;
  ctx.beginPath();ctx.moveTo(ax,ay);ctx.bezierCurveTo(ax+(bx-ax)*.42,ay-28+(j%3)*32,bx-(bx-ax)*.46,by+35,bx,by);
  ctx.strokeStyle=j<5?"#bc83e9":"#674487";ctx.shadowColor="#ad64ff";ctx.shadowBlur=j<5?12:2;ctx.lineWidth=j<5?2:1;ctx.stroke();
 }
 for(let i=0;i<points.length;i++){
  const [x,y,name,heat,allocation]=points[i],px=+x*w,py=+y*h,picked=i===(expanded?7:1);
  ctx.beginPath();ctx.arc(px,py,combined?2+allocation:(i<5?7:4),0,Math.PI*2);
  ctx.shadowColor="#c880ff";ctx.shadowBlur=combined?4+heat*28:4+heat*16;ctx.fillStyle=picked?"#ffe2ff":"#c59bec";ctx.fill();
  if(picked){ctx.beginPath();ctx.arc(px,py,combined?23:19,0,Math.PI*2);ctx.strokeStyle="#eabaff";ctx.lineWidth=1;ctx.stroke()}
  ctx.shadowBlur=0;ctx.font=(picked?"600 ":"")+"12px system-ui";ctx.textAlign=x>.72?"right":"left";ctx.fillStyle="#f5e7ff";
  ctx.fillText(name,px+(x>.72?-15:15),py-9);
 }
}
new ResizeObserver(draw).observe(canvas);
</script>
